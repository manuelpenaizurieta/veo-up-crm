/* ---------- Tareas automáticas del Content Day ----------
   Al estar en «Content Day agendado» con fecha: «Enviar propuesta de contenido» (48 h después de reservar)
   y «Recordatorio por WhatsApp» (el día antes). Id fijo por lead: no se duplican. Si cambia la fecha, se recolocan. */
function fechaMadridMas(iso,horas){const d=new Date(iso);if(isNaN(d))return null;return horaMadrid(new Date(d.getTime()+horas*3600000).toISOString())}
let RECON_EN_CURSO=false;
async function reconciliarTareasCD(){
  if(SUPA)return; /* en Supabase las crea un trigger */
  if(RECON_EN_CURSO||!db||!canWrite||!allReady())return;RECON_EN_CURSO=true;
  try{
    for(const n0 of S.negocios){
      let n=n0;
      if(n.etapa==="Cliente"&&n.contentDay&&n.contentDay>=hoyISO()&&n.reservaEstado==="confirmada"){
        const upd={...cambiosDeEtapa(n,"Content Day agendado"),reservaAviso:"",actualizado:new Date().toISOString()};
        await db.doc("negocios/"+n.id).update(upd);
        await registrar(n.id,"Etapa","Cliente → Content Day agendado (ya tenía reservado el "+fechaLarga(n.contentDay)+(n.contentDayHora?" a las "+n.contentDayHora:"")+")","rescd2_"+(n.reservaId||n.contentDay));
        n={...n,...upd};
      }
      if(n.etapa!=="Content Day agendado"||!n.contentDay)continue;
      const sid=String(n.id).replace(/[^A-Za-z0-9_-]/g,"_");const cd=fechaLarga(n.contentDay)+(n.contentDayHora?" a las "+n.contentDayHora:"");
      /* 1) propuesta: 48 h desde la reserva (una vez por lead; si cambia de reserva y no está hecha, se recalcula) */
      const tp=S.tareas.find(t=>t.id==="auto_prop_"+sid);const clave=n.reservaId||n.contentDay;
      if(!tp||(!tp.hecha&&tp.clave!==clave)){
        const base=(!tp&&n.reservaAct)||new Date().toISOString();const f=fechaMadridMas(base,48)||{fecha:sumarDias(hoyISO(),2),hora:""};
        await db.doc("tareas/auto_prop_"+sid).set({negocioId:n.id,texto:"Enviar propuesta de contenido (Content Day: "+cd+")",responsable:n.responsable||"",fecha:f.fecha,hora:f.hora,
          estado:"pendiente",hecha:false,auto:"propuesta",clave,creado:tp?tp.creado:new Date().toISOString(),autor:null,autorNombre:null});
      }
      /* 2) recordatorio: el día antes del Content Day; si cambia la fecha, se recoloca (y se reabre si ya estaba hecho) */
      const tw=S.tareas.find(t=>t.id==="auto_wa_"+sid);const fw=sumarDias(n.contentDay,-1);
      if(!tw||tw.fecha!==fw){
        await db.doc("tareas/auto_wa_"+sid).set({negocioId:n.id,texto:"Recordatorio por WhatsApp del Content Day ("+cd+")",responsable:n.responsable||"",fecha:fw,hora:"",
          estado:"pendiente",hecha:false,auto:"recordatorio",clave:n.contentDay,creado:tw?tw.creado:new Date().toISOString(),autor:null,autorNombre:null});
      }
    }
  }catch(e){}finally{RECON_EN_CURSO=false}
}

function leerCSV(t){const filas=[];let f=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];

}
function leerTablaMd(t,clave="Submission ID",pestana){
  let todo=String(t);
  if(pestana){const k=todo.indexOf("### Sheet Name: "+pestana);if(k>=0)todo=todo.slice(k)}
  const crudas=todo.split(/\r?\n/);let ini=-1;
  for(let x=0;x<crudas.length;x++){const l=crudas[x].trim();if(l.startsWith("|")&&l.replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim()).includes(clave)){ini=x;break}}
  if(ini<0)return null;let fin=ini;while(fin<crudas.length&&crudas[fin].trim().startsWith("|"))fin++;

  const celdas=l=>l.trim().replace(/^\|/,"").replace(/\|$/,"").split(/(?<!\\)\|/).map(x=>x.trim().replace(/\\([\\`*_{}\[\]()#+\-.!|>~])/g,"$1"));

}
function textoDeResultado(r,clave="Submission ID"){
  const out=[];const p=r&&r.payload;
  if(p&&typeof p==="object"&&typeof p.content==="string")out.push(p.content);
  for(const b of(r&&r.content)||[]){if(b.type==="resource"&&b.resource){if(typeof b.resource.text==="string")out.push(b.resource.text);if(typeof b.resource.blob==="string")out.push({b64:b.resource.blob})}if(b.type==="text")out.push(b.text)}
  for(const x of out){let s=x;if(typeof x==="object"){try{s=new TextDecoder().decode(Uint8Array.from(atob(x.b64),c=>c.charCodeAt(0)))}catch(e){continue}}
    if(typeof s==="string"&&s.includes(clave))return s;
    if(typeof s==="string"&&/^[A-Za-z0-9+/=\s]+$/.test(s)&&s.length>20){try{const d=new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));if(d.includes(clave))return d}catch(e){}}}
  return null;
}

    new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout",message:"sin respuesta en "+Math.round(ms/1000)+" s"}),ms))])

async function leerHoja(mcp,fileId=HOJA_FORM,clave="Submission ID"){

  let e1=null;

    const t=textoDeResultado(r,clave);if(t){const f=leerCSV(t);if(f.length&&f[0].includes(clave))return{filas:f,via:"csv"}}}

/* ---------- Leer una pestaña concreta de la hoja ----------
   Se pide la exportación .xlsx (trae todas las pestañas completas), se descomprime en el navegador y se lee la pestaña por nombre. */
function bytesDeResultado(r){
  const cands=[];const p=r&&r.payload;
  if(p&&typeof p==="object"){for(const k of["content","data","blob"])if(typeof p[k]==="string")cands.push(p[k])}else if(typeof p==="string")cands.push(p);
  for(const b of(r&&r.content)||[]){if(b.type==="resource"&&b.resource){if(typeof b.resource.blob==="string")cands.push(b.resource.blob);if(typeof b.resource.text==="string")cands.push(b.resource.text)}if(b.type==="text"&&typeof b.text==="string")cands.push(b.text)}
  for(const c of cands){try{const bin=atob(c.replace(/\s/g,""));if(bin.charCodeAt(0)===0x50&&bin.charCodeAt(1)===0x4b)return Uint8Array.from(bin,ch=>ch.charCodeAt(0))}catch(e){}}
  return null;
}
async function abrirZip(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);let e=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0)throw{code:"formato",message:"zip sin directorio"};
  const total=dv.getUint16(e+10,true);let off=dv.getUint32(e+16,true);const dir={};const dec=new TextDecoder();
  for(let k=0;k<total;k++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    const met=dv.getUint16(off+10,true),tam=dv.getUint32(off+20,true),nl=dv.getUint16(off+28,true),xl=dv.getUint16(off+30,true),cl=dv.getUint16(off+32,true),loc=dv.getUint32(off+42,true);
    dir[dec.decode(u8.subarray(off+46,off+46+nl))]={met,tam,loc};off+=46+nl+xl+cl;
  }
  return async nombre=>{const f=dir[nombre];if(!f)return null;
    const ini=f.loc+30+dv.getUint16(f.loc+26,true)+dv.getUint16(f.loc+28,true);const datos=u8.subarray(ini,ini+f.tam);
    if(f.met===0)return dec.decode(datos);
    const st=new Blob([datos]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return dec.decode(await new Response(st).arrayBuffer())};
}
function colDeRef(ref){const m=String(ref||"").match(/^[A-Z]+/);if(!m)return-1;let n=0;for(const ch of m[0])n=n*26+ch.charCodeAt(0)-64;return n-1}
async function pestanaDeXlsx(u8,pestana,clave){
  const leer=await abrirZip(u8);const X=t=>new DOMParser().parseFromString(t,"application/xml");
  const wb=X(await leer("xl/workbook.xml")||"");const hojas=[...wb.getElementsByTagName("sheet")];
  const rels=X(await leer("xl/_rels/workbook.xml.rels")||"");
  const ruta=hoja=>{const rid=hoja.getAttribute("r:id")||hoja.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
    const rel=[...rels.getElementsByTagName("Relationship")].find(x=>x.getAttribute("Id")===rid);if(!rel)return null;
    const d=rel.getAttribute("Target");return d.startsWith("/")?d.slice(1):"xl/"+d};

  const leerHojaXml=async hoja=>{const r=ruta(hoja);return r?filasDeHoja(X(await leer(r)||""),ss):null};

  if(porNombre){const f=await leerHojaXml(porNombre);if(f&&f.length&&f[0].includes(clave))return f}

  for(const hj of hojas){if(hj===porNombre)continue;const f=await leerHojaXml(hj);if(f&&f.length&&f[0].includes(clave))return f}

function filasDeHoja(sh,ss){const filas=[];
  for(const row of sh.getElementsByTagName("row")){const f=[];
    for(const c of row.getElementsByTagName("c")){const i=colDeRef(c.getAttribute("r"));const t=c.getAttribute("t");
      const v=c.getElementsByTagName("v")[0];let val="";
      if(t==="s")val=v?ss[Number(v.textContent)]??"":"";
      else if(t==="inlineStr")val=[...c.getElementsByTagName("t")].map(x=>x.textContent).join("");
      else val=v?v.textContent:"";
      if(i>=0){while(f.length<i)f.push("");f[i]=val}else f.push(val)}

let XLSX_CACHE={id:"",t:0,u8:null};
async function leerPestana(mcp,fileId,pestana,clave){
  let e1=null;
  try{let u8=XLSX_CACHE.id===fileId&&Date.now()-XLSX_CACHE.t<15000?XLSX_CACHE.u8:null;
    if(!u8){const r=await llamarDrive(mcp,"download_file_content",{fileId,exportMimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"},25000);
      u8=bytesDeResultado(r);if(u8)XLSX_CACHE={id:fileId,t:Date.now(),u8}}if(!u8)throw{code:"formato",message:"la exportación .xlsx no trajo un archivo"};
    const filas=await pestanaDeXlsx(u8,pestana,clave);
    if(!filas.length||!filas[0].includes(clave))throw{code:"formato",message:"la pestaña «"+pestana+"» no tiene la columna «"+clave+"»"};
    return{filas,via:"xlsx"};
  }catch(e){e1=e;if(e&&e.code==="sin_pestana")throw e /* el .xlsx se leyó bien y esa pestaña no existe: no hace falta la lectura en texto */}

/* ---------- Reservas del Content Day → ficha del lead ----------
   Regla de Manu (2026-11-14): se guarda fecha y hora; si el lead está en «Cliente» pasa a «Content Day agendado»;
   si está en otra etapa solo se guarda y se avisa. Las reservas sin lead van a una lista aparte (no se crean leads).
   Las filas cuyo negocio empieza por «PRUEBA» se ignoran. */
const normTxt=t=>String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
function horaMadrid(iso){
  /* si Sheets guardó la fecha como fecha (número de serie, en hora de la hoja = Madrid), se lee tal cual */
  if(/^\d+(\.\d+)?$/.test(String(iso||"").trim())){const d=new Date(Date.UTC(1899,11,30)+Math.round(Number(iso)*86400)*1000);
    return{fecha:d.toISOString().slice(0,10),hora:d.toISOString().slice(11,16)}}
  const d=new Date(iso);if(isNaN(d))return null;
  const p=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Madrid",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(d).map(x=>[x.type,x.value]));
  return{fecha:p.year+"-"+p.month+"-"+p.day,hora:p.hour+":"+p.minute}}

  const em=String(r.email||"").trim().toLowerCase(),tel=ultimos9(r.tel),neg=normTxt(r.negocio);

  return (em&&vivos.find(n=>String(n.email||"").trim().toLowerCase()===em))
    ||(tel.length===9&&vivos.find(n=>ultimos9(n.whatsapp)===tel))
    ||(neg&&vivos.find(n=>normTxt(n.nombre)===neg))||null;
}
async function sincronizarReservas(mcp){

    email:o["Email"],tel:o["Teléfono"],negocio:o["Negocio"],estado:String(o["Estado"]||"").toLowerCase(),act:o["Actualizado"]||""}))
    .filter(r=>r.id); /* las filas «PRUEBA…» se aplican si casan con un lead; si no, no salen en «reservas sin lead» */

    const prev=porLead.get(n.id);if(!prev||String(r.act)>String(prev.r.act))porLead.set(n.id,{n,r})}

    }

  const pintar=()=>{const q=inp.value.trim().toLowerCase();
    const negs=(q?S.negocios.filter(n=>[n.nombre,n.contacto,n.apellidos,n.email,n.whatsapp,n.sector,n.localidad,n.barrio].join(" ").toLowerCase().includes(q))
      :S.negocios.slice().sort((a,b)=>(b.fechaEntrada||"").localeCompare(a.fechaEntrada||""))).slice(0,7).map(n=>({n}));
    const secs=IRA.filter(x=>!q||x.t.toLowerCase().includes(q)).slice(0,q?4:3);
    const acc=canWrite&&(!q||"nuevo negocio".includes(q)||"añadir".includes(q))?[{acc:abrirNuevo,t:"Nuevo negocio",s:"Acción",ico:"mas2"}]:[];
    items=[...negs,...acc,...secs];if(sel>=items.length)sel=0;

      return h("button",{type:"button",class:"cmdk-i",role:"option","aria-selected":String(i===sel),onmouseenter:()=>{sel=i;marcar()},onclick:()=>elegir(i)},
        n?h("span",{class:"ci bav v"+varAvatar(n.nombre),text:iniciales(n.nombre)}):h("span",{class:"ci",html:icono(it.ico)}),
        h("span",null,h("b",{text:n?n.nombre||"Sin nombre":it.t}),h("small",{text:n?[n.contacto,n.etapa,n.whatsapp].filter(Boolean).join(" · "):it.s})),
        n?pillEtapa(n):null)};
    let i=0;lista.replaceChildren(...(items.length?[
      negs.length?h("div",{class:"cmdk-g",text:q?"Negocios":"Recientes"}):null,...negs.map(it=>fila(it,i++)),
      acc.length||secs.length?h("div",{class:"cmdk-g",text:"Ir a"}):null,...[...acc,...secs].map(it=>fila(it,i++))]

  $("#dlg").replaceChildren(h("div",{class:"cmdk-bg",onclick:e=>{if(e.target===e.currentTarget)cerrarDialogo()}},
    h("div",{class:"cmdk",role:"dialog","aria-modal":"true","aria-label":"Buscar"},h("div",{class:"cmdk-top",html:icono("buscar")},inp),lista,
      h("div",{class:"cmdk-foot"},h("span",null,h("kbd",{text:"↑↓"})," moverse"),h("span",null,h("kbd",{text:"Enter"})," abrir"),h("span",null,h("kbd",{text:"Esc"})," cerrar")))));
